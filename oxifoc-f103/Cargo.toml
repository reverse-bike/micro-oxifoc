[package]
name = "oxifoc-f103"
version = "0.7.1"
edition = "2024"
publish = false
description = "26,200-byte Hall/back-EMF CAN FOC firmware for STM32F103"

[lib]
test = true

[[bin]]
name = "oxifoc-f103"
path = "src/main.rs"
test = false
bench = false
required-features = ["firmware"]

[features]
default = []
board = ["dep:cortex-m", "dep:cortex-m-rt", "dep:stm32f1"]
firmware = ["board"]
calibration-image = ["board"]

[dependencies]
oxifoc-core = { workspace = true }
cortex-m = { workspace = true, optional = true }
cortex-m-rt = { workspace = true, optional = true }
stm32f1 = { workspace = true, optional = true }
