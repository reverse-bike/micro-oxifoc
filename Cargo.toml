[workspace]
resolver = "2"
members = [
    "oxifoc-core",
    "oxifoc-f103",
    "oxifoc-f103-calibration",
]

[workspace.dependencies]
oxifoc-core = { path = "oxifoc-core" }
oxifoc-f103 = { path = "oxifoc-f103", default-features = false }
cortex-m = { version = "=0.7.8", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
stm32f1 = { version = "0.15", features = ["stm32f103", "rt"] }

# Curated strict lints; members opt in through their lints table.
[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
use_self = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
dbg_macro = "warn"
string_slice = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
unused_result_ok = "warn"
iter_not_returning_iterator = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
lossy_float_literal = "warn"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true

[profile.release.package.oxifoc-core]
opt-level = 2

# The calibration image trades more speed for size than the ride firmware.
[profile.calibration]
inherits = "release"
opt-level = "z"

[profile.calibration.package.oxifoc-core]
opt-level = "s"

[profile.calibration.package.oxifoc-f103]
opt-level = "s"
